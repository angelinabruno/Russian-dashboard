<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Тетрадь: Russian study</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=PT+Serif:ital,wght@0,400;0,700;1,400&family=Neucha&display=swap">
<style>
/* Layout: a Russian school exercise book. Squared paper, red margin rule, ink-blue writing; dark mode is the classroom blackboard. */
:root{
  --paper:#f6f8f6; --grid:rgba(60,100,170,.11); --card:#ffffff; --line:#d8dde6;
  --ink:#1c2f6b; --ink-soft:#56628a; --pencil:#626674;
  --margin:#c93a4b; --margin-soft:rgba(201,58,75,.10);
  --good:#2b7a4b; --good-soft:rgba(43,122,75,.12); --bad:#b5303d; --bad-soft:rgba(181,48,61,.10);
  --hi:#fff3b8;
  --f-display:"PT Serif", Georgia, "Times New Roman", serif;
  --f-body:"Golos Text", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-hand:"Neucha", "Comic Sans MS", cursive;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#1b2522; --grid:rgba(225,240,230,.045); --card:#222e2a; --line:#33423d;
  --ink:#eaf0ea; --ink-soft:#a8b8b0; --pencil:#93a39b;
  --margin:#ec7d88; --margin-soft:rgba(236,125,136,.12);
  --good:#86d3a1; --good-soft:rgba(134,211,161,.13); --bad:#f2919a; --bad-soft:rgba(242,145,154,.12);
  --hi:rgba(255,236,150,.16); color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#1b2522; --grid:rgba(225,240,230,.045); --card:#222e2a; --line:#33423d;
  --ink:#eaf0ea; --ink-soft:#a8b8b0; --pencil:#93a39b;
  --margin:#ec7d88; --margin-soft:rgba(236,125,136,.12);
  --good:#86d3a1; --good-soft:rgba(134,211,161,.13); --bad:#f2919a; --bad-soft:rgba(242,145,154,.12);
  --hi:rgba(255,236,150,.16); color-scheme:dark }

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:22px 22px;
  color:var(--ink); font-family:var(--f-body); font-size:16px; line-height:1.55;
}
.wrap{max-width:1000px;margin:0 auto;padding-block:20px 56px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));position:relative}
@media (min-width:820px){
  .wrap{padding-left:max(64px, env(safe-area-inset-left, 0px))}
  .wrap::before{content:"";position:absolute;top:0;bottom:0;left:40px;width:2px;background:var(--margin);opacity:.55}
}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.2;font-weight:700}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--margin);outline-offset:2px;border-radius:6px}
.hand{font-family:var(--f-hand)}
.eyebrow{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--pencil);font-weight:600}
.muted{color:var(--pencil)}
.tabnum{font-variant-numeric:tabular-nums}

/* header */
.top{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end;justify-content:space-between;padding-bottom:16px;border-bottom:2px solid var(--ink);margin-bottom:6px}
.title-block{min-width:0}
.title-block h1{font-size:clamp(28px,5vw,40px);letter-spacing:-.01em}
.title-block .sub{color:var(--ink-soft);margin-top:4px;font-size:15px}
.lessons{display:flex;gap:6px;flex-wrap:wrap}
.lesson{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;font-size:14px;color:var(--pencil)}
.lesson[aria-current="true"]{border-color:var(--ink);color:var(--ink);font-weight:600}
.lesson:disabled{cursor:default;opacity:.75}
.lesson small{font-size:11px;margin-left:4px}

nav.tabs{display:flex;gap:4px;margin:0 0 24px;overflow-x:auto;scrollbar-width:none}
nav.tabs a{flex:0 0 auto;text-decoration:none;color:var(--ink-soft);padding:10px 16px 9px;border-bottom:3px solid transparent;font-weight:500;display:flex;gap:8px;align-items:baseline}
nav.tabs a span.ru{font-family:var(--f-display);font-size:17px}
nav.tabs a span.en{font-size:12px;color:var(--pencil)}
nav.tabs a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--margin)}
nav.tabs a:hover{color:var(--ink)}
@media (max-width:560px){nav.tabs a span.en{display:none} nav.tabs a{padding:10px 10px 9px}}

.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
.section-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:28px 0 12px;flex-wrap:wrap}
.section-h h2{font-size:22px}
.btn{border:1.5px solid var(--ink);background:var(--ink);color:var(--paper);border-radius:8px;padding:9px 16px;font-weight:600;font-size:15px}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.small{padding:6px 12px;font-size:14px}
.btn{white-space:nowrap}
.btn:hover{filter:brightness(1.1)}

/* home */
.next{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:640px){.next{grid-template-columns:1fr}}
.next .panel{padding:18px 20px;display:flex;flex-direction:column;gap:8px}
.next .panel h3{font-size:20px}
.next .panel p{margin:0;color:var(--ink-soft);font-size:15px}
.next .panel .btn{align-self:flex-start;margin-top:6px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:14px}
@media (max-width:640px){.stats{grid-template-columns:1fr}}
.stat{padding:14px 18px}
.stat .v{font-family:var(--f-display);font-size:30px;font-weight:700;line-height:1.1}
.stat .l{font-size:13px;color:var(--pencil)}
.days{display:flex;gap:4px;margin-top:8px}
.days i{flex:1;height:14px;border-radius:3px;background:var(--line)}
.days i.on{background:var(--margin)}
.progress-cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:760px){.progress-cols{grid-template-columns:1fr}}
.plist{padding:6px 0}
.prow{display:grid;grid-template-columns:minmax(0,1fr) 110px 52px;gap:12px;align-items:center;padding:9px 18px;border:0;background:none;width:100%;text-align:left}
.prow + .prow{border-top:1px solid var(--line)}
.prow:hover{background:var(--margin-soft)}
.prow .n{min-width:0}
.prow .n b{font-weight:500;display:block;font-size:15px}
.prow .n small{color:var(--pencil);font-size:12.5px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar > span{display:block;height:100%;background:var(--ink);border-radius:3px}
.bar.good > span{background:var(--good)}
.prow .pct{text-align:right;font-variant-numeric:tabular-nums;font-size:14px;color:var(--ink-soft)}
.plist-h{padding:14px 18px 6px;display:flex;justify-content:space-between;align-items:baseline}
.plist-h h3{font-size:18px}

/* flashcards */
.deckbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:14px;color:var(--ink-soft)}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.chip .c{opacity:.7;margin-left:4px;font-variant-numeric:tabular-nums}
.cardtools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:12px}
.toggle{display:inline-flex;border:1.5px solid var(--line);border-radius:8px;overflow:hidden;background:var(--card)}
.toggle button{border:0;background:none;padding:6px 12px;font-size:14px;color:var(--ink-soft)}
.toggle button[aria-pressed="true"]{background:var(--margin-soft);color:var(--ink);font-weight:600}
.flash{perspective:1400px;max-width:620px;margin:0 auto}
.flash-inner{position:relative;min-height:280px;transition:transform .45s cubic-bezier(.3,.7,.3,1);transform-style:preserve-3d;cursor:pointer}
.flash.flipped .flash-inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--card);border:1px solid var(--line);border-radius:14px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px 24px;gap:10px;
  background-image:linear-gradient(90deg,transparent 30px,var(--margin-soft) 30px,var(--margin-soft) 32px,transparent 32px)}
.face.back{transform:rotateY(180deg)}
.face .word{font-family:var(--f-display);font-size:clamp(26px,6vw,40px);line-height:1.2;overflow-wrap:anywhere}
.face .en-word{font-size:clamp(22px,5vw,30px);font-weight:600}
.face .note{color:var(--ink-soft);font-size:15px;max-width:44ch}
.face .hint{position:absolute;bottom:12px;font-size:12px;color:var(--pencil)}
.face .known-tag{position:absolute;top:12px;right:16px;font-family:var(--f-hand);color:var(--good);font-size:18px}
.flash-actions{display:flex;gap:10px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.flash-actions .btn{min-width:140px}
.btn.again{background:transparent;color:var(--bad);border-color:var(--bad)}
.btn.know{background:var(--good);border-color:var(--good);color:var(--paper)}
.counter{text-align:center;color:var(--pencil);font-size:14px;margin-top:10px}
.empty{text-align:center;padding:40px 20px;color:var(--ink-soft)}
.empty .hand{font-size:28px;color:var(--margin);display:block;margin-bottom:6px}
.kbd{font-size:12px;color:var(--pencil);text-align:center;margin-top:6px}
@media (hover:none){.kbd{display:none}}

/* grammar */
.gram{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:760px){.gram{grid-template-columns:1fr}}
details.g{background:var(--card);border:1px solid var(--line);border-radius:var(--r);min-width:0}
details.g[open]{grid-column:1/-1}
details.g summary{list-style:none;padding:14px 18px;cursor:pointer;display:flex;gap:12px;align-items:baseline}
details.g summary::-webkit-details-marker{display:none}
details.g summary .no{font-family:var(--f-hand);color:var(--margin);font-size:22px;min-width:22px}
details.g summary h3{font-size:18px;flex:1}
details.g summary .pg{font-size:12px;color:var(--pencil);white-space:nowrap}
details.g summary::after{content:"+";font-size:20px;color:var(--pencil);line-height:1}
details.g[open] summary::after{content:"–"}
.gbody{padding:0 18px 18px 52px;display:flex;flex-direction:column;gap:12px}
@media (max-width:520px){.gbody{padding-left:18px}}
.gbody p{margin:0;max-width:68ch}
.gbody .ex{font-family:var(--f-display);font-size:16.5px}
.tbl{overflow-x:auto}
.tbl table{border-collapse:collapse;font-size:15px;min-width:100%}
.tbl th,.tbl td{border:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}
.tbl th{background:var(--margin-soft);font-weight:600;font-size:13px}
.tbl td{font-family:var(--f-display)}
.tbl td.lbl{font-family:var(--f-body);font-size:13px;color:var(--ink-soft)}
mark{background:var(--hi);color:inherit;padding:0 1px;border-radius:2px}
.end{color:var(--margin);font-weight:700}
.note-box{border-left:3px solid var(--margin);padding:6px 12px;background:var(--margin-soft);border-radius:0 6px 6px 0;font-size:15px}

/* quizzes */
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.qcard{padding:16px 18px;display:flex;flex-direction:column;gap:6px;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:var(--r)}
.qcard:hover{border-color:var(--ink)}
.qcard .ru{font-family:var(--f-display);font-size:20px;font-weight:700}
.qcard .en{font-size:13px;color:var(--pencil);margin-top:-4px}
.qcard p{margin:4px 0 0;font-size:14px;color:var(--ink-soft);flex:1}
.qcard .best{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--pencil);margin-top:6px;gap:8px}
.mark{font-family:var(--f-hand);color:var(--margin);font-size:22px;line-height:1}
.qcard.test{border:1.5px solid var(--margin)}
.quiz{max-width:680px;margin:0 auto}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px}
.qprog{display:flex;gap:4px;margin-bottom:18px}
.qprog i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.qprog i.ok{background:var(--good)}
.qprog i.no{background:var(--bad)}
.qprog i.cur{background:var(--ink)}
.qbox{padding:24px 22px}
.qbox .prompt-k{font-size:13px;color:var(--pencil);margin-bottom:8px}
.qbox .prompt{font-family:var(--f-display);font-size:clamp(21px,4.4vw,27px);line-height:1.35;overflow-wrap:anywhere}
.qbox .prompt .blank{display:inline-block;min-width:3.5em;border-bottom:2px solid var(--margin);text-align:center}
.qbox .prompt-en{color:var(--ink-soft);margin-top:6px;font-size:15px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}
@media (max-width:520px){.opts{grid-template-columns:1fr}}
.opt{border:1.5px solid var(--line);background:var(--paper);border-radius:8px;padding:12px 14px;text-align:left;font-family:var(--f-display);font-size:18px;display:flex;gap:10px;align-items:baseline}
.opt .k{font-family:var(--f-body);font-size:12px;color:var(--pencil);min-width:12px}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.built{font-family:var(--f-display);font-size:clamp(20px,4.2vw,25px);margin-top:14px;padding:10px 14px;background:var(--paper);border:1px dashed var(--line);border-radius:8px;overflow-wrap:anywhere}
.slot{display:inline-block;min-width:3.5em;border-bottom:2px solid var(--margin);text-align:center;padding:0 2px}
.slot.good{color:var(--good);border-color:var(--good)} .slot.bad{color:var(--bad);border-color:var(--bad);text-decoration:line-through}
.two-row{margin-top:16px;display:flex;flex-direction:column;gap:8px}
.two-opts{display:flex;flex-wrap:wrap;gap:8px}
.opt.two{flex:1 1 130px;justify-content:center;padding:10px 12px}
.opt.sel{border-color:var(--ink);background:var(--margin-soft);font-weight:700}
.btn:disabled{opacity:.4;cursor:default;filter:none}
.feedback{margin-top:16px;padding:12px 14px;border-radius:8px;font-size:15px}
.feedback.ok{background:var(--good-soft)}
.feedback.no{background:var(--bad-soft)}
.feedback b.h{font-family:var(--f-hand);font-size:20px;font-weight:400;margin-right:6px}
.feedback.ok b.h{color:var(--good)} .feedback.no b.h{color:var(--bad)}
.qnext{display:flex;justify-content:flex-end;margin-top:16px}
.result{text-align:center;padding:30px 22px}
.result .grade{font-family:var(--f-hand);color:var(--margin);font-size:84px;line-height:1;transform:rotate(-6deg);display:inline-block}
.result .gword{font-family:var(--f-hand);color:var(--margin);font-size:26px}
.result .score{font-family:var(--f-display);font-size:22px;margin-top:10px}
.review{text-align:left;margin-top:22px;border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:8px}
.review div{font-size:15px}
.review .r-q{font-family:var(--f-display)}
.review .r-a{color:var(--good);font-weight:600}
.result .actions{display:flex;gap:10px;justify-content:center;margin-top:20px;flex-wrap:wrap}

footer{margin-top:44px;padding-top:14px;border-top:1px solid var(--line);font-size:13px;color:var(--pencil);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
@media (prefers-reduced-motion:reduce){.flash-inner{transition:none}}
</style>

<div class="wrap">
  <header class="top">
    <div class="title-block">
      <div class="eyebrow" id="ch-eyebrow">Голоса · Book One</div>
      <h1 id="ch-title">Урок</h1>
      <div class="sub" id="ch-sub"></div>
    </div>
    <div class="lessons" aria-label="Chapters">
      <button class="lesson" data-act="chapter" data-ch="2">Урок 2</button>
      <button class="lesson" data-act="chapter" data-ch="3">Урок 3</button>
      <button class="lesson" data-act="chapter" data-ch="4">Урок 4</button>
    </div>
  </header>
  <nav class="tabs" aria-label="Sections">
    <a href="#home" data-route="home"><span class="ru">Главная</span><span class="en">Home</span></a>
    <a href="#cards" data-route="cards"><span class="ru">Слова</span><span class="en">Flashcards</span></a>
    <a href="#grammar" data-route="grammar"><span class="ru">Грамматика</span><span class="en">Grammar</span></a>
    <a href="#tests" data-route="tests"><span class="ru">Тесты</span><span class="en">Quizzes</span></a>
  </nav>
  <main id="view"></main>
  <footer>
    <span id="sync">Progress is saved in this browser.</span>
    <span>Stress marks follow the textbook. Grades use the Russian 5-point scale.</span>
  </footer>
</div>

/* ---------- state + persistence ---------- */
const KEY="tetrad-u3-v1";
const blank = () => ({known:{}, quizzes:{}, days:[], updated:0});
let state = blank();
try { const raw = localStorage.getItem(KEY); if (raw) state = Object.assign(blank(), JSON.parse(raw)); } catch(e){}
let dbRef=null, writing=false, pendingWrite=false, writeTimer=null;
function merge(a,b){
  const out = blank();
  const decks = new Set([...Object.keys(a.known||{}),...Object.keys(b.known||{})]);
  decks.forEach(d => out.known[d] = [...new Set([...(a.known?.[d]||[]),...(b.known?.[d]||[])])]);
  const qs = new Set([...Object.keys(a.quizzes||{}),...Object.keys(b.quizzes||{})]);
  qs.forEach(q => { const x=a.quizzes?.[q]||{}, y=b.quizzes?.[q]||{};
    const newer = (x.at||0) >= (y.at||0) ? x : y;
    out.quizzes[q] = {best:Math.max(x.best||0,y.best||0), last:newer.last||0, at:newer.at||0, n:Math.max(x.n||0,y.n||0)}; });
  out.days = [...new Set([...(a.days||[]),...(b.days||[])])].sort().slice(-120);
  out.updated = Math.max(a.updated||0,b.updated||0);
  return out;
}
function save(){
  state.updated = Date.now();
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e){}
  if (!dbRef) return;
  clearTimeout(writeTimer); writeTimer = setTimeout(flush, 1200);
}
async function flush(){
  if (!dbRef) return;
  if (writing){ pendingWrite=true; return; }
  writing=true;
  try { await dbRef.set(JSON.parse(JSON.stringify(state))); setSync(true); }
  catch(e){ if (e && e.code==="invalid_argument") { dbRef=null; setSync(false); } }
  writing=false;
  if (pendingWrite){ pendingWrite=false; flush(); }
}
function setSync(ok){ $("#sync").textContent = ok ? "Progress is saved to your account, so it follows you between devices." : "Progress is saved in this browser."; }
function markDay(){ const t=today(); if (!state.days.includes(t)) state.days.push(t); }
(async () => {
  try {
    if (!window.claude || !window.claude.use) return;
    const [db,user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if (!db || !user) return;
    const uid = await user.id(); if (!uid) return;
    const ref = db.doc("data/users/"+uid+"/progress");
    const snap = await ref.get();
    dbRef = ref;
    if (snap.exists){ state = merge(state, snap.data()); try{localStorage.setItem(KEY, JSON.stringify(state));}catch(e){} render(); }
    setSync(true);
    if (!snap.exists && (state.days.length || Object.keys(state.quizzes).length)) flush();
  } catch(e) { /* stays on browser storage */ }
})();

function optsFrom(correct, pool, n=3){
  const c = P(correct); const seen=new Set([c]); const out=[];
  for (const x of shuffle(pool)){ const px=P(x); if(!seen.has(px)){seen.add(px); out.push(x);} if(out.length>=n) break; }
  return shuffle([correct, ...out]);
}

  if (Math.random()<.5) return {k:"What does this mean?", q:S(it[0]), opts:optsFrom(it[1], deck.items.map(i=>i[1])), a:it[1], ex:it[2]?S(it[2]):"", ru:false};
  return {k:"How do you say this in Russian?", q:esc(it[1]), opts:optsFrom(it[0], deck.items.map(i=>i[0])), a:it[0], ex:it[2]?S(it[2]):"", ru:true};
}
function accAdjOpts(a, nomA){
  const sp = nomA.match(/^(мо|тво|наш|ваш|эт|одн)(а|я)$/);
  if (sp){ const st=sp[1]; const soft=/^(мо|тво)$/.test(st);
    return fill4(a, [nomA, st+(soft?"ю":"у"), st+(soft||/[шщжч]$/.test(st)?"ей":"ой"), {мо:"мой",тво:"твой",наш:"наш",ваш:"ваш",эт:"этот",одн:"один"}[st]]); }
  const m = nomA.match(/^(.*?)(ая|яя|ый|ий|ой|ое|ее|ые|ие)$/); if (!m) return fill4(a,[nomA]);
  const st = m[1]; const soft = /яя|ее$/.test(m[2]) || (m[2]==="ий" && !/[кгхжшщч]$/.test(st)) || (m[2]==="ие" && !/[кгхжшщч]$/.test(st));
  const set = /^(мо|тво)$/.test(st) ? ["ю","я","ей","й"] : soft ? ["юю","яя","ей","ий"] : ["ую","ая","ой", /[кгхжшщч]$/.test(st)?"ий":"ый"];
  return fill4(a, [nomA, ...set.map(e=>st+e)]);
}
function accNounOpts(n, nomN){
  const st = nomN.replace(/[аяьй]$/,"").replace(/и$/,"");
  const c = [nomN, st+"у", st+"ю", st+"е", st+"ы", st+"и"].filter(w=>!/[кгхжшщч]ы|[кгхжшщчц][яю]/.test(w));
  return fill4(n, c);
}

    <div class="panel stat"><div class="v tabnum">${studied}<span class="muted" style="font-size:18px"> of 14 days</span></div><div class="l">studied in the last two weeks</div><div class="days">${last14.map(x=>`<i class="${x?"on":""}"></i>`).join("")}</div></div>
  </div>
  <div class="section-h"><h2>Прогресс по темам</h2><span class="muted">Progress by topic</span></div>
  <div class="progress-cols">
    <div class="panel plist"><div class="plist-h"><h3>Flashcard decks</h3><span class="muted" style="font-size:13px">known</span></div>
      ${decks.map(x=>`<button class="prow" data-act="open-deck" data-deck="${x.d.id}"><span class="n"><b>${S(x.d.ru)}</b><small>${esc(x.d.en)} · ${x.n} words</small></span><span class="bar ${x.p===100?"good":""}"><span style="width:${x.p}%"></span></span><span class="pct">${x.p}%</span></button>`).join("")}
    </div>
    <div class="panel plist"><div class="plist-h"><h3>Quizzes</h3><span class="muted" style="font-size:13px">best score</span></div>
      ${C().quizzes.map(q=>{const r=state.quizzes[q.id]; const b=r?r.best:0; return `<button class="prow" data-act="start" data-quiz="${q.id}"><span class="n"><b>${S(q.ru)}</b><small>${esc(q.en)}${r?` · ${r.n} attempt${r.n===1?"":"s"}, last ${r.last}%`:" · not tried yet"}</small></span><span class="bar ${b>=90?"good":""}"><span style="width:${b}%"></span></span><span class="pct">${r?b+"%":"—"}</span></button>`;}).join("")}
    </div>
  </div>`;
}

function deckOrder(){
  const d = C().decks.find(x=>x.id===cardState.deck);
  const known = new Set(state.known[d.id]||[]);
  let idx = d.items.map((_,i)=>i);
  if (cardState.onlyNew) idx = idx.filter(i=>!known.has(P(d.items[i][0])));
  cardState.order = shuffle(idx); cardState.i = 0; cardState.flipped=false;
}
function cardsHTML(){
  const d = C().decks.find(x=>x.id===cardState.deck);
  if (!cardState.order.length && !cardState._init){ cardState._init=true; deckOrder(); }
  const known = new Set(state.known[d.id]||[]);
  const chips = C().decks.map(x=>{const p=deckPct(x); return `<button class="chip" aria-pressed="${x.id===d.id}" data-act="deck" data-deck="${x.id}">${esc(x.en)}<span class="c">${p.k}/${p.n}</span></button>`;}).join("");
  const tools = `<div class="cardtools">
    <div class="toggle" role="group" aria-label="Card direction"><button aria-pressed="${cardState.dir==="ru"}" data-act="dir" data-dir="ru">Русский → English</button><button aria-pressed="${cardState.dir==="en"}" data-act="dir" data-dir="en">English → Русский</button></div>
    <div class="toggle" role="group" aria-label="Which cards"><button aria-pressed="${!cardState.onlyNew}" data-act="only" data-v="0">All cards</button><button aria-pressed="${cardState.onlyNew}" data-act="only" data-v="1">Not known yet</button></div>
  </div>`;
  if (cardState.i >= cardState.order.length){
    const p = deckPct(d);
    return `<div class="deckbar">${chips}</div>${tools}<div class="panel empty"><span class="hand">${p.p===100?"Молодец!":"Ко^нчено!"}</span>
      ${cardState.order.length? `You went through ${cardState.order.length} cards.`:"Every card in this deck is marked as known."} ${p.k} of ${p.n} in this deck are known.
      <div class="flash-actions"><button class="btn" data-act="restart">Go again</button>${p.k?`<button class="btn ghost" data-act="reset-deck">Reset this deck</button>`:""}</div></div>`;
  }
  const it = d.items[cardState.order[cardState.i]];
  const isKnown = known.has(P(it[0]));
  const ruFace = `<div class="word">${S(it[0])}</div>`;
  const enFace = `<div class="en-word">${esc(it[1])}</div>`;
  const note = it[2] ? `<div class="note">${S(it[2])}</div>` : "";
  const front = cardState.dir==="ru" ? ruFace : enFace;
  const back = cardState.dir==="ru" ? enFace + `<div class="note" style="font-family:var(--f-display)">${S(it[0])}</div>` + note : ruFace + note;
  return `<div class="deckbar">${chips}</div>${tools}
   <div class="flash ${cardState.flipped?"flipped":""}" id="flash">
     <div class="flash-inner" data-act="flip" role="button" tabindex="0" aria-label="Flip card">
       <div class="face front">${isKnown?'<span class="known-tag">зна^ю</span>'.replace("^","́"):""}${front}<span class="hint">Tap to flip</span></div>
       <div class="face back">${back}</div>
     </div>
   </div>
   <div class="flash-actions"><button class="btn again" data-act="again">Ещё раз · again</button><button class="btn know" data-act="know">Зна&#769;ю · I know it</button></div>
   <div class="counter tabnum">Card ${cardState.i+1} of ${cardState.order.length}</div>
   <div class="kbd">Space flips · → I know it · ← again</div>`;
}

function grammarHTML(){
  return `<div class="section-h" style="margin-top:0"><h2>Грамма^тика</h2><span class="muted">${C().gram.length} topics from the chapter. Red letters are the endings to learn.</span></div>`.replace(/\^/g,"́") +
   `<div class="gram">${C().gram.map((g,i)=>`<details class="g"${i===0?" open":""}><summary><span class="no">${i+1}</span><h3>${esc(g.t)}</h3><span class="pg">${g.pg}</span></summary><div class="gbody">${S(g.h)}</div></details>`).join("")}</div>`;
}

function testsHTML(){
  return `<div class="section-h" style="margin-top:0"><h2>Те^сты</h2><span class="muted">Ten questions each. Your best score is kept.</span></div>`.replace(/\^/g,"́") +
   `<div class="qgrid">${C().quizzes.map(q=>{const r=state.quizzes[q.id]; const g=r?grade(r.best):null;
     return `<button class="qcard ${q.test?"test":""}" data-act="start" data-quiz="${q.id}"><span class="ru">${S(q.ru)}</span><span class="en">${esc(q.en)}</span><p>${esc(q.d)}</p>
     <span class="best"><span>${r?`Best ${r.best}% · ${r.n} tr${r.n===1?"y":"ies"}`:"Not tried yet"}</span>${g?`<span class="mark">${g[0]}</span>`:""}</span></button>`;}).join("")}</div>`;
}

function startQuiz(id){
  const def = ALLQ().find(q=>q.id===id); const gens = def && def.mix ? def.mix : Array(10).fill(id);
  const qs=[]; const seen=new Set();
  for (const g of shuffle(gens)){ let q, tries=0; do { q = GEN[g](); tries++; } while (seen.has(q.q) && tries<12); seen.add(q.q); qs.push(q); }
  quiz = {id, qs, i:0, answers:[], picked:null, pick2:{a:null,n:null}};
  go("tests"); render();
}
function quizHTML(){
  const Q = ALLQ().find(q=>q.id===quiz.id);
  const bar = quiz.qs.map((_,i)=>`<i class="${i<quiz.answers.length?(quiz.answers[i]?"ok":"no"):i===quiz.i?"cur":""}"></i>`).join("");
  if (quiz.i >= quiz.qs.length){
    const right = quiz.answers.filter(Boolean).length, pct = Math.round(100*right/quiz.qs.length); const [g,w] = grade(pct);
    const wrong = quiz.qs.filter((_,i)=>!quiz.answers[i]);
    return `<div class="quiz"><div class="qprog">${bar}</div><div class="panel result">
      <div class="grade">${g}</div><div class="gword">${S(w)}</div>
      <div class="score tabnum">${right} of ${quiz.qs.length} right · ${pct}%</div>
      ${wrong.length?`<div class="review"><span class="eyebrow">Worth another look</span>${wrong.map(q=>`<div><span class="r-q">${q.q.replace(/<span class="blank">___<\/span>/,"___")}</span> → <span class="r-a">${q.ru?S(q.a):esc(q.a)}</span></div>`).join("")}</div>`:""}
      <div class="actions"><button class="btn" data-act="start" data-quiz="${quiz.id}">Try again</button><button class="btn ghost" data-act="quit">All quizzes</button></div></div></div>`;
  }
  const q = quiz.qs[quiz.i]; const answered = quiz.picked!==null;
  if (q.two) return quizHead(Q, bar) + twoHTML(q, answered) + `<div class="kbd">Pick one adjective and one noun, then check</div></div>`;
  const ok = answered && P(quiz.picked)===P(q.a);
  const optsH = q.opts.map((o,i)=>{ let cls=""; if(answered){ if(P(o)===P(q.a)) cls="right"; else if(o===quiz.picked) cls="wrong"; }
    return `<button class="opt ${cls}" data-act="answer" data-i="${i}" ${answered?"disabled":""}><span class="k">${i+1}</span><span>${q.ru?S(o):esc(o)}</span></button>`; }).join("");
  return quizHead(Q, bar) + `
    <div class="panel qbox"><div class="prompt-k">${q.k}</div><div class="prompt">${q.q}</div>
      <div class="opts">${optsH}</div>
      ${answered?`<div class="feedback ${ok?"ok":"no"}"><b class="h">${ok?"Ве^рно!".replace("^","\u0301"):"Не совсе^м.".replace("^","\u0301")}</b>${ok?"":`The answer is <b>${q.ru?S(q.a):esc(q.a)}</b>. `}${q.ex||""}</div>
      <div class="qnext"><button class="btn" data-act="next" id="nextbtn">${quiz.i===quiz.qs.length-1?"See my grade":"Next question"}</button></div>`:""}
    </div>
    <div class="kbd">Keys 1–4 answer · Enter goes on</div></div>`;
}
function quizHead(Q, bar){
  return `<div class="quiz">
    <div class="qhead"><div><div class="eyebrow">${esc(Q.en)}</div><h2 style="font-size:22px">${S(Q.ru)}</h2></div><button class="btn ghost small" data-act="quit">Leave quiz</button></div>
    <div class="qprog">${bar}</div>`;
}
function twoHTML(q, answered){
  const p = quiz.pick2;
  const okA = p.a===q.adjA, okN = p.n===q.nounA, ok = okA && okN;
  const row = (label, opts, which, sel, right) => `<div class="two-row"><span class="eyebrow">${label}</span><div class="two-opts">${opts.map(o=>{
      let cls = sel===o ? "sel" : ""; if (answered){ cls = o===right ? "right" : (sel===o ? "wrong" : ""); }
      return `<button class="opt two ${cls}" data-act="pick2" data-w="${which}" data-v="${esc(o)}" ${answered?"disabled":""}>${esc(o)}</button>`; }).join("")}</div></div>`;
  const slot = (v, good) => `<span class="slot ${answered?(good?"good":"bad"):""}">${v?esc(v):"___"}</span>`;
  return `<div class="panel qbox"><div class="prompt-k">${q.k}</div><div class="prompt">${q.q}</div>
    <div class="built">${esc(q.prep)} ${slot(p.a, okA)} ${slot(p.n, okN)}</div>
    ${row("1 · Adjective", q.adjOpts, "a", p.a, q.adjA)}${row("2 · Noun", q.nounOpts, "n", p.n, q.nounA)}
    ${answered ? `<div class="feedback ${ok?"ok":"no"}"><b class="h">${ok?"Ве\u0301рно!":"Не совсе\u0301м."}</b>${ok?"":`The answer is <b>${esc(q.a)}</b>${!okA&&okN?" (the noun was right)":okA&&!okN?" (the adjective was right)":""}. `}${q.ex}</div>
      <div class="qnext"><button class="btn" data-act="next" id="nextbtn">${quiz.i===quiz.qs.length-1?"See my grade":"Next question"}</button></div>`
      : `<div class="qnext"><button class="btn" data-act="check2" ${p.a&&p.n?"":"disabled"}>Check</button></div>`}
  </div>`;
}
function answer(i){
  if (!quiz || quiz.picked!==null) return;
  const q = quiz.qs[quiz.i]; quiz.picked = q.opts[i]; quiz.answers.push(P(quiz.picked)===P(q.a));
  render(); const n=$("#nextbtn"); if(n) n.focus({preventScroll:true});
}
function nextQ(){
  if (!quiz || quiz.picked===null) return;
  quiz.i++; quiz.picked=null; quiz.pick2={a:null,n:null};
  if (quiz.i>=quiz.qs.length){
    const pct = Math.round(100*quiz.answers.filter(Boolean).length/quiz.qs.length);
    const r = state.quizzes[quiz.id] || {best:0,n:0};
    state.quizzes[quiz.id] = {best:Math.max(r.best,pct), last:pct, at:Date.now(), n:(r.n||0)+1};
    markDay(); save();
  }
  render();
}
function cardMark(know){
  const d = C().decks.find(x=>x.id===cardState.deck); const it = d.items[cardState.order[cardState.i]];
  const set = new Set(state.known[d.id]||[]); const key=P(it[0]);
  if (know) set.add(key); else set.delete(key);
  state.known[d.id] = [...set]; markDay(); save();
  if (!know) cardState.order.push(cardState.order[cardState.i]);
  cardState.i++; cardState.flipped=false; render();
}

document.addEventListener("click", e => {
  const t = e.target.closest("[data-act]"); if (!t) return;
  const a = t.dataset.act;
  if (a==="chapter"){ setChapter(+t.dataset.ch); return; }
  if (a==="open-deck"){ cardState.deck=t.dataset.deck; cardState.onlyNew = deckPct(C().decks.find(x=>x.id===t.dataset.deck)).k>0; deckOrder(); cardState._init=true; go("cards"); }
  else if (a==="deck"){ cardState.deck=t.dataset.deck; deckOrder(); render(); }
  else if (a==="dir"){ cardState.dir=t.dataset.dir; cardState.flipped=false; render(); }
  else if (a==="only"){ cardState.onlyNew = t.dataset.v==="1"; deckOrder(); render(); }
  else if (a==="flip"){ cardState.flipped=!cardState.flipped; $("#flash").classList.toggle("flipped", cardState.flipped); }
  else if (a==="know") cardMark(true);
  else if (a==="again") cardMark(false);
  else if (a==="restart"){ deckOrder(); render(); }
  else if (a==="reset-deck"){ state.known[cardState.deck]=[]; save(); cardState.onlyNew=false; deckOrder(); render(); }
  else if (a==="start") startQuiz(t.dataset.quiz);
  else if (a==="answer") answer(+t.dataset.i);
  else if (a==="next") nextQ();
  else if (a==="pick2"){ if (quiz && quiz.picked===null){ quiz.pick2[t.dataset.w]=t.dataset.v; render(); } }
  else if (a==="check2"){ if (quiz && quiz.picked===null && quiz.pick2.a && quiz.pick2.n){ const q=quiz.qs[quiz.i]; quiz.picked=quiz.prep2Str=`${q.prep} ${quiz.pick2.a} ${quiz.pick2.n}`; quiz.answers.push(quiz.picked===q.a); render(); const n=$("#nextbtn"); if(n) n.focus({preventScroll:true}); } }
  else if (a==="quit"){ quiz=null; render(); }
});
document.addEventListener("keydown", e => {
  if (e.target.closest && e.target.closest("input,textarea,select")) return;
  if (route==="cards" && $("#flash")){
    if (e.key===" " || (e.key==="Enter" && !e.target.closest("button"))){ e.preventDefault(); cardState.flipped=!cardState.flipped; $("#flash").classList.toggle("flipped", cardState.flipped); }
    else if (e.key==="ArrowRight") cardMark(true);
    else if (e.key==="ArrowLeft") cardMark(false);
  }
  if (route==="tests" && quiz){
    if (/^[1-4]$/.test(e.key) && quiz.picked===null && !quiz.qs[quiz.i].two){ const i=+e.key-1; if (i<quiz.qs[quiz.i]?.opts.length) answer(i); }
    else if (e.key==="Enter" && quiz.picked!==null && !e.target.closest("button")){ e.preventDefault(); nextQ(); }
  }
});
render();
</script>

</body>
</html>
